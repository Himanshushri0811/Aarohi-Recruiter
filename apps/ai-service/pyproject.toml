[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aarohi-ai-service"
version = "0.1.0"
description = "Production-Grade AI Interview Service with Aarohi Real-Time Conversational Agent"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "AI Recruiter Team", email = "engineering@airecruiter.io"}
]
keywords = ["interview", "ai-agent", "livekit", "realtime", "recruitment", "fastapi"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
livekit = [
    "livekit>=0.18.0",
    "livekit-agents>=0.12.0",
    "livekit-plugins-deepgram>=0.6.0",
    "livekit-plugins-cartesia>=0.6.0",
    "livekit-plugins-google>=0.6.0",
]
google = [
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
]
openai = [
    "openai>=1.50.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "UP042", "E402"]
